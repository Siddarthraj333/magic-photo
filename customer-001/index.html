<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magic Photo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      padding: 20px;
    }

    /* Polaroid container - authentic ratio */
    .polaroid {
      background: #ffffff;
      width: 90vw;
      max-width: 380px;
      border-radius: 4px;
      box-shadow: 
        0 4px 8px rgba(0,0,0,0.2),
        0 12px 40px rgba(0,0,0,0.3);
      padding: 16px 16px 45px 16px;
      position: relative;
      transition: transform 0.3s ease;
    }

    .polaroid:hover {
      transform: scale(1.02);
    }

    /* Photo area - square like real Polaroid */
    .photo-area {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f0f0f0;
      position: relative;
      border: 1px solid #e0e0e0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
      background: #000;
    }

    /* Play overlay */
    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .play-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .play-button {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.2s ease;
    }

    .play-overlay:hover .play-button {
      transform: scale(1.1);
    }

    .play-button::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 25px solid #333;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      margin-left: 6px;
    }

    /* Caption area - handwritten style */
    .caption {
      text-align: center;
      font-size: 16px;
      color: #333;
      margin-top: 16px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.5px;
      line-height: 1.4;
    }

    /* Loading indicator */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 14px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Muted indicator */
    .muted-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .muted-hint.show {
      opacity: 1;
    }

    @media (max-width: 480px) {
      .polaroid {
        max-width: 340px;
        padding: 14px 14px 40px 14px;
      }

      .caption {
        font-size: 14px;
        margin-top: 12px;
      }

      .play-button {
        width: 70px;
        height: 70px;
      }

      .play-button::after {
        border-left-width: 20px;
        border-top-width: 12px;
        border-bottom-width: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="polaroid">
    <div class="photo-area">
      <video
        id="magicVideo"
        loop
        playsinline
        preload="auto"
        muted>
        <source src="https://res.cloudinary.com/dlrbrlr4z/video/upload/v1769687734/202601291706_bpjiai.mp4" type="video/mp4">
      </video>
      
      <div class="play-overlay" id="playOverlay">
        <div class="play-button"></div>
      </div>

      <div class="muted-hint" id="mutedHint">Tap to unmute 🔊</div>
    </div>

    <div class="caption">Tap to relive the moment ✨</div>
  </div>

  <script>
    const video = document.getElementById("magicVideo");
    const playOverlay = document.getElementById("playOverlay");
    const mutedHint = document.getElementById("mutedHint");
    let hasPlayedOnce = false;

    // Attempt autoplay on load (muted)
    window.addEventListener('load', () => {
      video.muted = true;
      video.play().catch(err => {
        console.log("Autoplay prevented:", err);
        // Show play overlay if autoplay fails
        playOverlay.classList.remove('hidden');
      });
    });

    // Handle video state changes
    video.addEventListener('play', () => {
      playOverlay.classList.add('hidden');
      
      if (!hasPlayedOnce && video.muted) {
        mutedHint.classList.add('show');
        setTimeout(() => {
          mutedHint.classList.remove('show');
        }, 3000);
      }
    });

    // Click/tap handler for play and unmute
    function handleInteraction(e) {
      e.preventDefault();
      
      if (video.paused) {
        // Start playing
        video.muted = false;
        video.play().then(() => {
          hasPlayedOnce = true;
          playOverlay.classList.add('hidden');
        }).catch(err => {
          console.log("Play error:", err);
          // If unmuted play fails, try muted
          video.muted = true;
          video.play();
        });
      } else if (video.muted) {
        // Unmute if already playing
        video.muted = false;
        mutedHint.classList.remove('show');
      } else {
        // Pause if playing with sound
        video.pause();
        playOverlay.classList.remove('hidden');
      }
    }

    // Add event listeners to both video and overlay
    playOverlay.addEventListener('click', handleInteraction);
    playOverlay.addEventListener('touchstart', handleInteraction);
    video.addEventListener('click', handleInteraction);
    video.addEventListener('touchstart', handleInteraction);

    // Prevent context menu on long press
    video.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
