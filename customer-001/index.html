<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magic Photo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Scan the photo to relive the moment." />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Polaroid = Canva size 2.75in x 4in */
    .polaroid {
      background: #fff;
      width: 825px; /* 2.75in @300dpi */
      aspect-ratio: 2.75 / 4;
      padding: 18px 18px 36px;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.65);
      text-align: center;
      box-sizing: border-box;
    }

    /* Scale nicely on mobile */
    @media (max-width: 900px) {
      .polaroid {
        width: 90vw;
        max-width: 420px;
      }
    }

    .video-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 6px;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .caption {
      margin-top: 16px;
      font-size: 14px;
      color: #444;
      letter-spacing: 0.6px;
    }

    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div class="polaroid">
    <div class="video-box">
      <video
        id="magicVideo"
        loop
        playsinline
        preload="metadata"
        controls>
        <source src="https://res.cloudinary.com/dlrbrlr4z/video/upload/v1769582197/WhatsApp_Video_2026-01-28_at_11.42.03_AM_qdsvzi.mp4" type="video/mp4">
      </video>
    </div>

    <div class="caption">Tap to relive the moment ✨</div>
    <div class="hint">🔊 Tap once for sound</div>
  </div>

  <script>
    const video = document.getElementById("magicVideo");

    function startVideo() {
      video.muted = false;   // 🔥 unlock sound
      video.volume = 1.0;
      video.play();
      document.removeEventListener("click", startVideo);
      document.removeEventListener("touchstart", startVideo);
    }

    document.addEventListener("click", startVideo);
    document.addEventListener("touchstart", startVideo);
  </script>
</body>
</html>
