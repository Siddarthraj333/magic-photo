<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magic Photo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Polaroid container (print ratio 2.75 : 4) */
    .polaroid {
      background: #fff;
      width: 90vw;
      max-width: 420px;
      aspect-ratio: 2.75 / 4;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Video area */
    .video-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 6px;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Caption — NO extra gap */
    .caption {
      text-align: center;
      font-size: 14px;
      color: #444;
      letter-spacing: 0.4px;
      margin-top: 10px;
      padding-bottom: 4px;
    }
  </style>
</head>

<body>
  <div class="polaroid">
    <div class="video-box">
      <video
        id="magicVideo"
        loop
        playsinline
        preload="metadata">
        <source src="https://res.cloudinary.com/dlrbrlr4z/video/upload/v1769582197/WhatsApp_Video_2026-01-28_at_11.42.03_AM_qdsvzi.mp4" type="video/mp4">
      </video>
    </div>

    <div class="caption">Tap to relive the moment ✨</div>
  </div>

  <script>
    const video = document.getElementById("magicVideo");

    function startVideo() {
      video.muted = false;
      video.volume = 1.0;
      video.play();
      document.removeEventListener("click", startVideo);
      document.removeEventListener("touchstart", startVideo);
    }

    document.addEventListener("click", startVideo);
    document.addEventListener("touchstart", startVideo);
  </script>
</body>
</html>
