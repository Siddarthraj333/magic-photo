<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magic Photo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Scan the photo to relive the moment." />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .polaroid {
      background: #fff;
      width: 320px;
      padding: 14px 14px 28px;
      border-radius: 6px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      text-align: center;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 4px;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .caption {
      margin-top: 14px;
      font-size: 14px;
      color: #444;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <div class="polaroid">
    <div class="video-box">
      <video
        id="magicVideo"
        muted
        loop
        playsinline
        preload="metadata">
        <source src="https://res.cloudinary.com/dlrbrlr4z/video/upload/v1769534283/THINGS_BAD_gaxom0.mp4" type="video/mp4">
      </video>
    </div>
    <div class="caption">Tap to relive the moment ✨</div>
  </div>

  <script>
    const video = document.getElementById("magicVideo");

    function startVideo() {
      video.play();
      document.removeEventListener("click", startVideo);
      document.removeEventListener("touchstart", startVideo);
    }

    document.addEventListener("click", startVideo);
    document.addEventListener("touchstart", startVideo);
  </script>
</body>
</html>
