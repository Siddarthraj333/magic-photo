<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Magic Photo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

.polaroid {
  background: #fff;
  width: 95vw;
  max-width: 420px;
  padding: 18px 18px 32px;
  border-radius: 10px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  text-align: center;
}

.video-box {
  width: 100%;
  aspect-ratio: 4 / 5;
  position: relative;
  overflow: hidden;
  border-radius: 4px;
  background: #000;
}

video {
  width: 100%;
  height: 100%;
  /* contain = shows full video, may have black bars */
  /* cover = fills frame, may crop video */
  object-fit: contain;
  display: block;
}

.caption {
  margin-top: 14px;
  font-size: 14px;
  color: #444;
}
</style>
</head>

<body>
<div class="polaroid">
  <div class="video-box">
    <video 
      controls
      playsinline
      preload="metadata">
      <source src="https://vz-f369372f-c85.b-cdn.net/0a68f073-8ead-4916-98cf-f60575cf39b3/playlist.m3u8" type="application/x-mpegURL">
    </video>
  </div>
  <div class="caption">“The beginning of forever.”✨</div>
</div>
</body>
</html>
