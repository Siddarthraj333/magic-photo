<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magic Photo</title>

  <!-- Trust & SEO -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Scan the photo to relive the moment." />
  <meta name="robots" content="index, follow" />

  <!-- Security -->
  <meta http-equiv="Content-Security-Policy"
        content="
        default-src 'self';
        img-src 'self' data:;
        media-src https://res.cloudinary.com;
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        " />

  <!-- iOS / Mobile trust -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111111" />



  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Polaroid Frame */
    .polaroid {
      background: #fff;
      width: 320px;
      padding: 16px 16px 50px;
      border-radius: 6px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 4px;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }

    .caption {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #444;
      letter-spacing: 0.4px;
    }
  </style>
</head>

<body>

  <div class="polaroid">
    <div class="video-wrapper">
      <video
  id="magicVideo"
  muted
  loop
  playsinline
  preload="metadata">
  <source src="https://res.cloudinary.com/dlrbrlr4z/video/upload/v1769509276/WhatsApp_Video_2026-01-27_at_1.12.34_PM_wal01h.mp4" type="video/mp4">
</video>

    </div>

    <div class="caption">Scan for Magic ✨</div>
  </div>

  <script>
  const video = document.getElementById("magicVideo");

  function startVideo() {
    video.play();
    document.removeEventListener("click", startVideo);
    document.removeEventListener("touchstart", startVideo);
  }

  document.addEventListener("click", startVideo);
  document.addEventListener("touchstart", startVideo);
</script>

</body>
</html>
