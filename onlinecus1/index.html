<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magic Photo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Scan the photo to relive the moment." />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .polaroid {
      background: #fff;
      width: 320px;
      padding: 14px 14px 28px;
      border-radius: 6px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      text-align: center;
      position: relative;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 4px;
      background: #000;
      position: relative;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .caption {
      margin-top: 14px;
      font-size: 14px;
      color: #444;
      letter-spacing: 0.5px;
    }

    /* Play overlay */
    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .play-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .play-button {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transform: scale(1);
      transition: transform 0.2s ease;
    }

    .play-overlay:active .play-button {
      transform: scale(0.95);
    }

    .play-button::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 20px solid #333;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      margin-left: 5px;
    }

    /* Sound hint */
    .sound-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 5;
    }

    .sound-hint.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="polaroid">
    <div class="video-box" id="videoBox">
      <video
        id="magicVideo"
        loop
        playsinline
        webkit-playsinline
        preload="auto"
        crossorigin="anonymous">
        <source src="https://pub-169729b1eedd4e57a4769cb24685cc0d.r2.dev/VN20260218_183657.mp4" type="video/mp4">
      </video>
      
      <div class="play-overlay" id="playOverlay">
        <div class="play-button"></div>
      </div>

      <div class="sound-hint" id="soundHint">🔊 Tap for sound</div>
    </div>
    <div class="caption">Tap to relive the moment ✨</div>
  </div>

  <script>
    const video = document.getElementById("magicVideo");
    const videoBox = document.getElementById("videoBox");
    const playOverlay = document.getElementById("playOverlay");
    const soundHint = document.getElementById("soundHint");
    let isPlaying = false;
    let hasInteracted = false;

    // Detect iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    function handleVideoClick(e) {
      e.preventDefault();
      e.stopPropagation();

      if (!isPlaying) {
        // First tap - start playing
        hasInteracted = true;
        
        // Try to play with sound first
        video.muted = false;
        
        const playPromise = video.play();
        
        if (playPromise !== undefined) {
          playPromise.then(() => {
            // Video started playing with sound
            isPlaying = true;
            playOverlay.classList.add('hidden');
            
            // Show sound hint briefly
            soundHint.classList.add('show');
            setTimeout(() => {
              soundHint.classList.remove('show');
            }, 2000);
          }).catch(err => {
            // Unmuted play failed (common on iOS Safari)
            console.log("Unmuted play failed, trying muted:", err);
            
            // Try muted play
            video.muted = true;
            video.play().then(() => {
              isPlaying = true;
              playOverlay.classList.add('hidden');
              
              // Show hint to tap again for sound
              soundHint.textContent = "🔊 Tap again for sound";
              soundHint.classList.add('show');
              
              // Auto-hide after 3 seconds
              setTimeout(() => {
                soundHint.classList.remove('show');
              }, 3000);
            }).catch(err2 => {
              console.error("Play failed completely:", err2);
              alert("Unable to play video. Please try refreshing the page.");
            });
          });
        }
      } else if (video.muted) {
        // Second tap - unmute if currently muted
        video.muted = false;
        soundHint.textContent = "🔊 Sound on!";
        soundHint.classList.add('show');
        setTimeout(() => {
          soundHint.classList.remove('show');
        }, 1500);
      } else {
        // Toggle pause/play
        if (video.paused) {
          video.play();
          playOverlay.classList.add('hidden');
        } else {
          video.pause();
          playOverlay.classList.remove('hidden');
        }
      }
    }

    // Listen for both click and touch events
    playOverlay.addEventListener('click', handleVideoClick);
    playOverlay.addEventListener('touchend', handleVideoClick);
    
    videoBox.addEventListener('click', handleVideoClick);
    videoBox.addEventListener('touchend', (e) => {
      e.preventDefault();
      handleVideoClick(e);
    });

    // Prevent context menu on long press
    video.addEventListener('contextmenu', (e) => e.preventDefault());
    
    // Handle video ended (shouldn't happen with loop, but just in case)
    video.addEventListener('ended', () => {
      video.currentTime = 0;
      video.play();
    });

    // iOS specific: Load video metadata
    if (isIOS) {
      video.load();
    }

    // Prevent default touch behavior
    document.addEventListener('touchstart', function(e) {
      if (e.target.closest('.video-box')) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
